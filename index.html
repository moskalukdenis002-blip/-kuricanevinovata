<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Курица не виновата</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root{
    --red:#ff2924;
    --red-dark:#d91d19;
    --orange:#ff7a00;
    --black:#080808;
    --dark:#111111;
    --card:#171717;
    --card2:#202020;
    --white:#ffffff;
    --gray:#a4a4a4;
    --green:#65d47b;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    background:#080808;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    color:inherit;
}

img{
    max-width:100%;
}

.app{
    width:100%;
    max-width:620px;
    margin:auto;
    padding-bottom:105px;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:64px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(8,8,8,.94);
    backdrop-filter:blur(18px);
}

.top-title{
    font-size:17px;
    font-weight:800;
    text-align:center;
    flex:1;
    margin:0 10px;
}

.icon-btn{
    width:44px;
    height:44px;
    border-radius:15px;
    background:#171717;
    border:1px solid #303030;
    display:grid;
    place-items:center;
    font-size:23px;
}

.cart-button{
    position:relative;
}

.badge{
    position:absolute;
    right:-3px;
    top:-3px;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:20px;
    background:var(--red);
    color:#fff;
    font-size:11px;
    font-weight:900;
    display:grid;
    place-items:center;
}

/* =========================
   HOME HERO
========================= */

.hero{
    position:relative;
    margin:0 10px;
    height:690px;
    border-radius:30px;
    overflow:hidden;

    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.08) 0%,
            rgba(0,0,0,.18) 35%,
            rgba(0,0,0,.68) 70%,
            #080808 100%
        ),
        url("https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=1200&q=90");

    background-size:cover;
    background-position:center;
}

.hero:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        180deg,
        transparent 35%,
        rgba(0,0,0,.15) 45%,
        rgba(0,0,0,.88) 91%
    );
    pointer-events:none;
}

.hero-logo{
    position:absolute;
    z-index:5;
    top:18px;
    left:18px;
    width:165px;
    background:#fff;
    padding:6px;
    border-radius:17px;
    box-shadow:0 12px 35px rgba(0,0,0,.55);
}

.hero-logo img{
    display:block;
    width:100%;
    border-radius:12px;
}

.hero-cart{
    position:absolute;
    z-index:8;
    top:18px;
    right:18px;
}

.hero-city{
    position:absolute;
    z-index:7;
    top:190px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(10,10,10,.72);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(15px);
    padding:11px 17px;
    border-radius:25px;
    font-weight:800;
    white-space:nowrap;
}

.hero-content{
    position:absolute;
    z-index:6;
    left:20px;
    right:20px;
    bottom:20px;
}

.hero-kicker{
    color:#ff725e;
    font-size:13px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:10px;
}

.hero-title{
    font-size:45px;
    line-height:.91;
    font-weight:950;
    letter-spacing:-2px;
    text-transform:uppercase;
    margin-bottom:15px;
}

.hero-title .red{
    color:#ff302a;
}

.hero-description{
    color:#e7e7e7;
    font-size:15px;
    line-height:1.4;
    margin-bottom:17px;
}

.hero-description strong{
    color:#fff;
    font-size:16px;
}

.main-button{
    width:100%;
    height:57px;
    border-radius:19px;
    background:var(--red);
    color:white;
    font-size:17px;
    font-weight:900;
    box-shadow:0 12px 30px rgba(255,40,35,.3);
}

.main-button:active{
    transform:scale(.985);
}

.hero-benefits{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:10px;
}

.hero-benefit{
    background:rgba(15,15,15,.72);
    border:1px solid rgba(255,255,255,.14);
    border-radius:15px;
    padding:9px 5px;
    text-align:center;
    font-size:10px;
    backdrop-filter:blur(12px);
}

.hero-benefit-icon{
    display:block;
    font-size:19px;
    margin-bottom:3px;
}

/* =========================
   SECTIONS
========================= */

.section{
    padding:24px 14px 0;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.section-title h2{
    margin:0;
    font-size:27px;
    letter-spacing:-.7px;
}

.section-title span{
    color:#888;
    font-size:12px;
}

/* =========================
   PRODUCT CARDS
========================= */

.products{
    display:grid;
    gap:11px;
}

.product{
    background:linear-gradient(145deg,#1b1b1b,#101010);
    border:1px solid #292929;
    border-radius:21px;
    overflow:hidden;
    display:grid;
    grid-template-columns:118px 1fr;
    min-height:135px;
}

.product-image{
    width:118px;
    height:100%;
    min-height:135px;
    object-fit:cover;
}

.product-content{
    padding:13px 11px;
    display:flex;
    flex-direction:column;
}

.product-name{
    font-size:16px;
    font-weight:900;
}

.product-description{
    color:#999;
    font-size:12px;
    line-height:1.35;
    margin-top:5px;
    flex:1;
}

.product-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
}

.product-price{
    font-size:17px;
    font-weight:950;
}

.add-button{
    width:43px;
    height:43px;
    border-radius:14px;
    background:var(--red);
    font-size:28px;
    display:grid;
    place-items:center;
}

/* =========================
   MENU
========================= */

.menu-page{
    padding-top:5px;
}

.search{
    height:48px;
    border-radius:17px;
    background:#171717;
    border:1px solid #2b2b2b;
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 14px;
    margin-bottom:12px;
}

.search span{
    color:#888;
    font-size:17px;
}

.search input{
    width:100%;
    background:none;
    border:0;
    outline:0;
    color:#fff;
    font-size:15px;
}

.search input::placeholder{
    color:#777;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:5px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    background:#181818;
    border:1px solid #2c2c2c;
    border-radius:18px;
    padding:10px 14px;
    font-size:13px;
    font-weight:800;
}

.category.active{
    background:var(--red);
    border-color:var(--red);
}

/* MENU BANNER */

.menu-banner{
    position:relative;
    height:155px;
    border-radius:23px;
    overflow:hidden;
    margin-bottom:15px;

    background-image:
        linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.18)),
        url("https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=1000&q=90");

    background-size:cover;
    background-position:center;
}

.menu-banner-text{
    position:absolute;
    left:17px;
    bottom:16px;
    font-size:27px;
    line-height:.94;
    font-weight:950;
    text-transform:uppercase;
}

.menu-banner-text span{
    color:#ff342c;
}

/* =========================
   DETAIL
========================= */

.detail-image{
    width:100%;
    height:330px;
    object-fit:cover;
    border-radius:0 0 28px 28px;
}

.detail-content{
    padding:18px;
}

.detail-tag{
    color:#ff4c43;
    font-size:13px;
    font-weight:900;
}

.detail-content h1{
    font-size:31px;
    margin:7px 0;
}

.detail-description{
    color:#aaa;
    line-height:1.45;
}

.portions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:17px 0;
}

.portion{
    background:#171717;
    border:1px solid #303030;
    border-radius:15px;
    padding:11px 5px;
    text-align:center;
    font-size:13px;
}

.portion strong{
    display:block;
    margin-bottom:4px;
}

.portion.active{
    background:var(--red);
    border-color:var(--red);
}

.quantity{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#171717;
    border-radius:16px;
    padding:7px;
    margin-bottom:10px;
}

.quantity button{
    width:43px;
    height:43px;
    border-radius:13px;
    background:#292929;
    font-size:23px;
}

.quantity-value{
    font-size:18px;
    font-weight:900;
}

/* =========================
   CART
========================= */

.cart-list{
    display:grid;
    gap:10px;
}

.cart-item{
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;
    padding:10px;
    display:grid;
    grid-template-columns:66px 1fr auto;
    gap:10px;
    align-items:center;
}

.cart-item img{
    width:66px;
    height:66px;
    border-radius:13px;
    object-fit:cover;
}

.cart-name{
    font-size:14px;
    font-weight:900;
}

.cart-price{
    color:#999;
    font-size:12px;
    margin-top:4px;
}

.stepper{
    display:flex;
    align-items:center;
    gap:7px;
}

.stepper button{
    width:28px;
    height:28px;
    border-radius:9px;
    background:#292929;
}

.total-box{
    margin-top:13px;
    background:#151515;
    border:1px solid #292929;
    border-radius:20px;
    padding:16px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    color:#999;
    margin:7px 0;
    font-size:13px;
}

.total-final{
    border-top:1px solid #292929;
    padding-top:14px;
    margin-top:13px;
    color:#fff;
    font-size:21px;
    font-weight:900;
}

/* =========================
   CITY
========================= */

.city-card{
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:9px;
}

.city-card.active{
    border-color:var(--red);
    box-shadow:0 0 0 1px rgba(255,41,36,.25) inset;
}

.city-icon{
    font-size:25px;
}

.city-info{
    flex:1;
}

.city-info strong{
    font-size:14px;
}

.city-info small{
    display:block;
    color:var(--green);
    margin-top:4px;
}

.city-check{
    color:#fff;
    font-weight:900;
}

/* =========================
   PROFILE
========================= */

.profile-head{
    background:#151515;
    border:1px solid #292929;
    border-radius:20px;
    padding:17px;
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:14px;
}

.profile-avatar{
    width:53px;
    height:53px;
    border-radius:50%;
    background:#292929;
    display:grid;
    place-items:center;
    font-size:24px;
}

.profile-name{
    font-size:18px;
    font-weight:900;
}

.profile-sub{
    color:#888;
    font-size:13px;
    margin-top:3px;
}

.profile-list{
    display:grid;
    gap:8px;
}

.profile-row{
    min-height:57px;
    background:#151515;
    border:1px solid #292929;
    border-radius:16px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 14px;
}

.profile-row .emoji{
    width:28px;
    text-align:center;
    font-size:20px;
}

.profile-row span:nth-child(2){
    flex:1;
    font-size:14px;
    font-weight:700;
}

.profile-row .arrow{
    color:#777;
    font-size:22px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:60;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    width:min(600px,calc(100% - 16px));
    height:72px;
    border-radius:25px;
    background:rgba(20,20,20,.96);
    border:1px solid #303030;
    backdrop-filter:blur(22px);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:5px;
}

.nav-button{
    position:relative;
    background:transparent;
    border-radius:20px;
    color:#777;
    font-size:10px;
    font-weight:800;
    display:grid;
    place-items:center;
    align-content:center;
    gap:2px;
}

.nav-button.active{
    background:#292929;
    color:#fff;
}

.nav-emoji{
    font-size:21px;
    line-height:23px;
}

.nav-badge{
    top:4px;
    right:23%;
}

/* =========================
   DRAWER
========================= */

.drawer{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.drawer.open{
    opacity:1;
    pointer-events:auto;
}

.drawer-panel{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:min(335px,88%);
    background:#111;
    border-right:1px solid #303030;
    padding:20px;
    transform:translateX(-100%);
    transition:.28s;
    overflow:auto;
}

.drawer.open .drawer-panel{
    transform:translateX(0);
}

.drawer-close{
    position:absolute;
    top:18px;
    right:15px;
}

.drawer-logo{
    width:155px;
    margin:45px 0 25px;
    background:#fff;
    border-radius:17px;
    padding:6px;
}

.drawer-logo img{
    width:100%;
    display:block;
    border-radius:11px;
}

.drawer-link{
    padding:16px 2px;
    border-bottom:1px solid #252525;
    font-size:15px;
    font-weight:800;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:94px;
    transform:translate(-50%,20px);
    background:#fff;
    color:#111;
    padding:12px 17px;
    border-radius:15px;
    font-size:14px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:70px 20px;
}

.empty-icon{
    font-size:60px;
}

.empty h2{
    margin:12px 0 5px;
}

.empty p{
    color:#888;
}

/* =========================
   MOBILE
========================= */

@media(max-width:390px){

    .hero{
        height:650px;
    }

    .hero-logo{
        width:140px;
    }

    .hero-city{
        top:170px;
    }

    .hero-title{
        font-size:39px;
    }

    .hero-description{
        font-size:14px;
    }

    .product{
        grid-template-columns:105px 1fr;
    }

    .product-image{
        width:105px;
    }
}

</style>
</head>

<body>

<div id="app" class="app"></div>

<!-- =========================
     BOTTOM NAVIGATION
========================= -->

<div class="bottom-nav">

    <button class="nav-button active" data-page="home">
        <span class="nav-emoji">🏠</span>
        <span>Главная</span>
    </button>

    <button class="nav-button" data-page="menu">
        <span class="nav-emoji">🍗</span>
        <span>Меню</span>
    </button>

    <button class="nav-button" data-page="cart">
        <span class="nav-emoji">🛒</span>
        <span>Корзина</span>
        <span id="navBadge" class="badge nav-badge" style="display:none">0</span>
    </button>

    <button class="nav-button" data-page="profile">
        <span class="nav-emoji">👤</span>
        <span>Профиль</span>
    </button>

</div>


<!-- =========================
     DRAWER
========================= -->

<div id="drawer" class="drawer">

    <div class="drawer-panel">

        <button class="icon-btn drawer-close" onclick="closeDrawer()">✕</button>

        <div class="drawer-logo">
            <img id="drawerLogo" src="">
        </div>

        <div class="drawer-link" onclick="go('home');closeDrawer()">
            🏠 Главная
        </div>

        <div class="drawer-link" onclick="go('menu');closeDrawer()">
            🍗 Меню
        </div>

        <div class="drawer-link" onclick="go('cart');closeDrawer()">
            🛒 Корзина
        </div>

        <div class="drawer-link" onclick="go('profile');closeDrawer()">
            👤 Профиль
        </div>

        <div class="drawer-link" onclick="showToast('🎁 Акции скоро появятся')">
            🎁 Акции
        </div>

        <div class="drawer-link" onclick="go('city');closeDrawer()">
            📍 Наши города
        </div>

        <div class="drawer-link" onclick="showToast('💬 Напишите нам в Telegram')">
            💬 Поддержка
        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram?.WebApp;

if(tg){

    tg.ready();
    tg.expand();

    try{

        tg.setHeaderColor('#080808');
        tg.setBackgroundColor('#080808');

    }catch(e){}

}


/* =========================
   LOGO
========================= */

const LOGO =
'assets/7FE6A965-CC94-4604-8928-5CE9D6C08CE8.jpeg';


/* =========================
   PRODUCTS
========================= */

const products = [

    {
        id:1,
        name:'Классические',
        description:'Тот самый хруст. Сочные внутри.',
        price:2990,
        image:'https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=800&q=90'
    },

    {
        id:2,
        name:'Острые',
        description:'Для тех, кто любит погорячее.',
        price:2990,
        image:'https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=800&q=90'
    },

    {
        id:3,
        name:'BBQ',
        description:'Дымный соус. Насыщенный вкус.',
        price:2990,
        image:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=90'
    },

    {
        id:4,
        name:'С сыром',
        description:'Нежные, ароматные и очень опасные.',
        price:3290,
        image:'https://images.unsplash.com/photo-1608039755401-742486ec466b?auto=format&fit=crop&w=800&q=90'
    }

];


/* =========================
   STATE
========================= */

let cart = [];

let currentPage = 'home';

let tempQuantity = 1;


/* =========================
   HELPERS
========================= */

function money(number){

    return number.toLocaleString('ru-RU') + ' ₸';

}


function logoHTML(){

    return `
        <img
            src="${LOGO}"
            alt="Курица не виновата"
            onerror="this.style.display='none'"
        >
    `;

}


/* =========================
   HEADER
========================= */

function header(title){

    return `

        <div class="topbar">

            <button
                class="icon-btn"
                onclick="openDrawer()"
            >
                ☰
            </button>

            <div class="top-title">
                ${title}
            </div>

            <button
                class="icon-btn cart-button"
                onclick="go('cart')"
            >

                🛒

                <span
                    id="topBadge"
                    class="badge"
                    style="${cart.length ? '' : 'display:none'}"
                >
                    ${cart.reduce((a,x)=>a+x.quantity,0)}
                </span>

            </button>

        </div>

    `;

}


/* =========================
   HOME
========================= */

function home(){

    return `

        ${header('Курица не виновата')}

        <section class="hero">

            <div class="hero-logo">
                ${logoHTML()}
            </div>

            <button
                class="icon-btn hero-cart"
                onclick="go('cart')"
            >
                🛒

                <span
                    id="heroBadge"
                    class="badge"
                    style="${cart.length ? '' : 'display:none'}"
                >
                    ${cart.reduce((a,x)=>a+x.quantity,0)}
                </span>

/* =========================
   RENDER
========================= */

function render(){

    const app =
        document.getElementById('app');


    if(currentPage === 'home'){
        app.innerHTML = home();
    }

    else if(currentPage === 'menu'){
        app.innerHTML = menu();
    }

    else if(currentPage === 'cart'){
        app.innerHTML = cartPage();
    }

    else if(currentPage === 'city'){
        app.innerHTML = city();
    }

    else if(currentPage === 'profile'){
        app.innerHTML = profile();
    }

    else if(currentPage.startsWith('product-')){

        const id =
            Number(currentPage.replace('product-',''));

        app.innerHTML =
            productDetail(id);

    }


    document
        .querySelectorAll('.nav-button')
        .forEach(button=>{

            button.classList.toggle(
                'active',
                button.dataset.page === currentPage
            );

        });


    updateBadges();

    window.scrollTo({
        top:0,
        behavior:'instant'
    });

}


/* =========================
   NAVIGATION
========================= */

function go(page){

    currentPage = page;

    render();

}


function openProduct(id){

    currentPage = 'product-' + id;

    render();

}


/* =========================
   CART
========================= */

function addToCart(id){

    const product =
        products.find(x=>x.id===id);

    if(!product) return;


    const existing =
        cart.find(x=>x.id===id);


    if(existing){

        existing.quantity++;

    }else{

        cart.push({
            ...product,
            quantity:1
        });

    }


    updateBadges();

    showToast('🍗 Добавлено в корзину');

}


function addProductQuantity(id){

    const product =
        products.find(x=>x.id===id);

    if(!product) return;


    const existing =
        cart.find(x=>x.id===id);


    if(existing){

        existing.quantity += tempQuantity;

    }else{

        cart.push({
            ...product,
            quantity:tempQuantity
        });

    }


    showToast('🔥 Крылья в корзине');

    setTimeout(()=>{
        go('cart');
    },350);

}


function changeCart(id,change){

    const item =
        cart.find(x=>x.id===id);

    if(!item) return;


    item.quantity += change;


    if(item.quantity <= 0){

        cart =
            cart.filter(x=>x.id!==id);

    }


    render();

}


/* =========================
   TEMP QUANTITY
========================= */

function changeTempQuantity(change){

    tempQuantity =
        Math.max(
            1,
            tempQuantity + change
        );


    const element =
        document.getElementById('tempQuantity');


    if(element){

        element.textContent =
            tempQuantity;

    }

}


/* =========================
   BADGES
========================= */

function updateBadges(){

    const count =
        cart.reduce(
            (sum,item)=>
                sum + item.quantity,
            0
        );


    const navBadge =
        document.getElementById('navBadge');


    if(navBadge){

        navBadge.textContent = count;

        navBadge.style.display =
            count ? 'grid' : 'none';

    }


    const topBadge =
        document.getElementById('topBadge');


    if(topBadge){

        topBadge.textContent = count;

        topBadge.style.display =
            count ? 'grid' : 'none';

    }


    const heroBadge =
        document.getElementById('heroBadge');


    if(heroBadge){

        heroBadge.textContent = count;

        heroBadge.style.display =
            count ? 'grid' : 'none';

    }

}


/* =========================
   SEARCH
========================= */

function filterProducts(query){

    const box =
        document.getElementById('menuProducts');

    if(!box) return;


    const search =
        query.toLowerCase().trim();


    const filtered =
        products.filter(product=>{

            return (
                product.name +
                ' ' +
                product.description
            )
            .toLowerCase()
            .includes(search);

        });


    box.innerHTML =
        filtered.map(productCard).join('');

}

/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById('toast');


    toast.textContent =
        message;


    toast.classList.add('show');


    setTimeout(()=>{

        toast.classList.remove('show');

    },1600);

}
