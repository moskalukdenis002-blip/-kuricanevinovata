<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Курица не виновата</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f7f3ed;
    color: #171717;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

button {
    font: inherit;
    border: 0;
    cursor: pointer;
}

.app {
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: 95px;
}

/* HEADER */

.header {
    background: #ff641f;
    padding: 18px 18px 22px;
    border-radius: 0 0 28px 28px;
}

.top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 62px;
    height: 62px;
    object-fit: cover;
    border-radius: 50%;
    background: white;
}

.brand {
    flex: 1;
}

.brand-title {
    font-size: 22px;
    font-weight: 900;
    line-height: 1;
}

.brand-subtitle {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 700;
}

.city-button {
    background: #171717;
    color: white;
    padding: 11px 13px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 13px;
}

/* CITY */

.city-panel {
    display: none;
    background: white;
    margin-top: 12px;
    border-radius: 18px;
    padding: 8px;
}

.city-panel.active {
    display: block;
}

.city-option {
    width: 100%;
    text-align: left;
    background: white;
    padding: 14px;
    border-radius: 12px;
    font-weight: 800;
}

.city-option:active {
    background: #f1f1f1;
}

/* CONTENT */

.content {
    padding: 20px 16px;
}

.hero {
    background: #171717;
    color: white;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
}

.hero-small {
    color: #ff641f;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
}

.hero h1 {
    font-size: 29px;
    line-height: 1;
    margin: 8px 0;
}

.hero p {
    margin: 0;
    color: #d7d7d7;
    font-size: 14px;
}

/* CATEGORIES */

.section-title {
    font-size: 21px;
    font-weight: 900;
    margin: 22px 0 12px;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex-shrink: 0;
    background: white;
    border: 2px solid transparent;
    padding: 11px 15px;
    border-radius: 14px;
    font-weight: 800;
}

.category.active {
    background: #171717;
    color: white;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.product {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.product-image {
    height: 145px;
    background: #ff641f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
}

.product-body {
    padding: 12px;
}

.product-name {
    font-size: 16px;
    font-weight: 900;
    line-height: 1.05;
}

.product-description {
    font-size: 12px;
    color: #777;
    margin-top: 5px;
    min-height: 30px;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
}

.price {
    font-size: 16px;
    font-weight: 900;
}

.add {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #171717;
    color: white;
    font-size: 22px;
    font-weight: 700;
}

/* CART */

.cart {
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: 72px;
    max-width: 572px;
    margin: auto;
    z-index: 20;
}

.cart-button {
    width: 100%;
    background: #ff641f;
    color: #171717;
    padding: 16px 18px;
    border-radius: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 900;
    box-shadow: 0 8px 25px rgba(0,0,0,.18);
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 66px;
    background: #171717;
    display: flex;
    justify-content: center;
    z-index: 30;
}

.nav-inner {
    width: 100%;
    max-width: 600px;
    display: flex;
}

.nav-button {
    flex: 1;
    background: transparent;
    color: #888;
    font-size: 11px;
    font-weight: 700;
}

.nav-button.active {
    color: #ff641f;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: flex-end;
    z-index: 100;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 600px;
    margin: auto auto 0;
    background: #f7f3ed;
    border-radius: 28px 28px 0 0;
    padding: 22px 18px 35px;
    max-height: 85vh;
    overflow-y: auto;
}

.modal-close {
    width: 100%;
    background: #171717;
    color: white;
    padding: 15px;
    border-radius: 16px;
    font-weight: 900;
    margin-top: 15px;
}

.cart-item {
    background: white;
    border-radius: 16px;
    padding: 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.cart-item-info {
    flex: 1;
}

.cart-item-name {
    font-weight: 900;
}

.cart-item-price {
    font-size: 13px;
    color: #777;
    margin-top: 3px;
}

.qty {
    display: flex;
    align-items: center;
    gap: 9px;
}

.qty button {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: #171717;
    color: white;
}

.total {
    background: #ff641f;
    border-radius: 18px;
    padding: 17px;
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    font-weight: 900;
}

/* ORDER */

.order-input {
    width: 100%;
    border: 0;
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-top: 9px;
    outline: none;
    font-size: 15px;
}

.order-button {
    width: 100%;
    margin-top: 14px;
    background: #171717;
    color: white;
    padding: 16px;
    border-radius: 16px;
    font-weight: 900;
}

/* DESKTOP */

@media (min-width: 601px) {
    .bottom-nav {
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="top">

            <img
                class="logo"
                src="assets/7FE6A965-CC94-4604-8928-5CE9D6C08CE8.jpeg"
                alt="Курица не виновата"
            >

            <div class="brand">
                <div class="brand-title">
                    КУРИЦА<br>НЕ ВИНОВАТА
                </div>

                <div class="brand-subtitle">
                    Виноват её вкус.
                </div>
            </div>

            <button class="city-button" onclick="toggleCities()">
                📍 <span id="currentCity">Павлодар</span>
            </button>

        </div>

        <div class="city-panel" id="cityPanel">

            <button class="city-option" onclick="selectCity('Павлодар')">
                📍 Павлодар
            </button>

            <button class="city-option" onclick="selectCity('Костанай')">
                📍 Костанай
            </button>

            <button class="city-option" onclick="selectCity('Астана')">
                📍 Астана
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="content">

        <section class="hero">

            <div class="hero-small">
                Сегодня можно
            </div>

            <h1>
                Совершить<br>
                преступление 🍗
            </h1>

            <p>
                Хрустящие крылья.<br>
                Соусы. Комбо. И никаких оправданий.
            </p>

        </section>


        <div class="section-title">
            Меню
        </div>


        <div class="categories">

            <button
                class="category active"
                onclick="filterProducts('Крылья', this)"
            >
                🍗 Крылья
            </button>

            <button
                class="category"
                onclick="filterProducts('Комбо', this)"
            >
                🔥 Комбо
            </button>

            <button
                class="category"
                onclick="filterProducts('Соусы', this)"
            >
                🥫 Соусы
            </button>

            <button
                class="category"
                onclick="filterProducts('Напитки', this)"
            >
                🥤 Напитки
            </button>

        </div>


        <div class="products" id="products"></div>

    </main>

</div>


<!-- CART -->

<div class="cart">

    <button class="cart-button" onclick="openCart()">

        <span>
            🛒 Корзина
            <span id="cartCount">0</span>
        </span>

        <span id="cartTotal">
            0 ₸
        </span>

    </button>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <div class="nav-inner">

        <button class="nav-button active" onclick="goHome()">
            🏠<br>Главная
        </button>

        <button class="nav-button" onclick="openCart()">
            🛒<br>Корзина
        </button>

        <button class="nav-button" onclick="showInfo()">
            ℹ️<br>О нас
        </button>

    </div>

</nav>


<!-- CART MODAL -->

<div class="modal" id="cartModal">

    <div class="modal-box">

        <h2>🛒 Твоя улика</h2>

        <div id="cartItems"></div>

        <div class="total">

            <span>Итого</span>

            <span id="modalTotal">
                0 ₸
            </span>

        </div>

        <button class="order-button" onclick="openOrder()">
            Совершить преступление →
        </button>

        <button class="modal-close" onclick="closeCart()">
            Вернуться к меню
        </button>

    </div>

</div>


<!-- ORDER MODAL -->

<div class="modal" id="orderModal">

    <div class="modal-box">

        <h2>🚨 Оформление заказа</h2>

        <p>
            <b id="orderCity">Павлодар</b>
        </p>

        <input
            class="order-input"
            id="customerName"
            placeholder="Имя"
        >

        <input
            class="order-input"
            id="customerPhone"
            placeholder="Телефон"
            type="tel"
        >

        <input
            class="order-input"
            id="customerAddress"
            placeholder="Адрес доставки"
        >

        <button class="order-button" onclick="sendOrder()">
            🍗 Заказать
        </button>

        <button class="modal-close" onclick="closeOrder()">
            Назад
        </button>

    </div>

</div>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================
   ГОРОДА
========================= */

let currentCity = "Павлодар";

function toggleCities() {

    const panel = document.getElementById("cityPanel");

    panel.classList.toggle("active");
}

function selectCity(city) {

    currentCity = city;

    document.getElementById("currentCity").innerText = city;

    document.getElementById("orderCity").innerText = city;

    document
        .getElementById("cityPanel")
        .classList.remove("active");

    if (tg) {
        tg.HapticFeedback.impactOccurred("light");
    }
}


/* =========================
   ТОВАРЫ
========================= */

const products = [

    {
        id: 1,
        name: "Крылья классические",
        description: "Хрустящие. Сочные. Без оправданий.",
        price: 2490,
        category: "Крылья",
        emoji: "🍗"
    },

    {
        id: 2,
        name: "Крылья острые",
        description: "Для тех, кто любит риск.",
        price: 2690,
        category: "Крылья",
        emoji: "🌶️🍗"
    },

    {
        id: 3,
        name: "Крылья BBQ",
        description: "Дымно. Сочно. Опасно вкусно.",
        price: 2790,
        category: "Крылья",
        emoji: "🍗🔥"
    },

    {
        id: 4,
        name: "Комбо №1",
        description: "Крылья + картофель + соус + напиток.",
        price: 3990,
        category: "Комбо",
        emoji: "🍗🍟🥤"
    },

    {
        id: 5,
        name: "Комбо №2",
        description: "Большая порция для большого преступления.",
        price: 4990,
        category: "Комбо",
        emoji: "🍗🍗🍟"
    },

    {
        id: 6,
        name: "Сырный соус",
        description: "Главный сообщник.",
        price: 390,
        category: "Соусы",
        emoji: "🧀"
    },

    {
        id: 7,
        name: "BBQ соус",
        description: "Дымная улика.",
        price: 390,
        category: "Соусы",
        emoji: "🥫"
    },

    {
        id: 8,
        name: "Кола",
        description: "Чтобы запить доказательства.",
        price: 590,
        category: "Напитки",
        emoji: "🥤"
    }

];


let activeCategory = "Крылья";

let cart = [];


/* =========================
   ПОКАЗ ТОВАРОВ
========================= */

function renderProducts() {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    const filtered =
        products.filter(
            product => product.category === activeCategory
        );

    filtered.forEach(product => {

        const card = document.createElement("div");

        card.className = "product";

        card.innerHTML = `

            <div class="product-image">
                ${product.emoji}
            </div>

            <div class="product-body">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-description">
                    ${product.description}
                </div>

                <div class="product-bottom">

                    <div class="price">
                        ${product.price.toLocaleString("ru-RU")} ₸
                    </div>

                    <button
                        class="add"
                        onclick="addToCart(${product.id})"
                    >
                        +
                    </button>

                </div>

            </div>
        `;

        container.appendChild(card);

    });

}


/* =========================
   КАТЕГОРИИ
========================= */

function filterProducts(category, button) {

    activeCategory = category;

    document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderProducts();

    if (tg) {
        tg.HapticFeedback.impactOccurred("light");
    }
}


/* =========================
   КОРЗИНА
========================= */

function addToCart(id) {

    const existing =
        cart.find(item => item.id === id);

    if (existing) {

        existing.qty++;

    } else {

        cart.push({
            id: id,
            qty: 1
        });

    }

    updateCart();

    if (tg) {
        tg.HapticFeedback.impactOccurred("medium");
    }

}


function updateCart() {

    const count =
        cart.reduce(
            (sum, item) => sum + item.qty,
            0
        );

    const total =
        cart.reduce((sum, item) => {

            const product =
                products.find(p => p.id === item.id);

            return sum + product.price * item.qty;

        }, 0);

    document.getElementById("cartCount").innerText = count;

    document.getElementById("cartTotal").innerText =
        total.toLocaleString("ru-RU") + " ₸";

    document.getElementById("modalTotal").innerText =
        total.toLocaleString("ru-RU") + " ₸";


    renderCart();
}


function renderCart() {

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML = `
            <p>
                Здесь пока пусто.<br>
                Преступление ещё не совершено 😎
            </p>
        `;

        return;
    }


    cart.forEach(item => {

        const product =
            products.find(p => p.id === item.id);

        const row =
            document.createElement("div");

        row.className = "cart-item";

        row.innerHTML = `

            <div class="cart-item-info">

                <div class="cart-item-name">
                    ${product.emoji} ${product.name}
                </div>

                <div class="cart-item-price">
                    ${product.price.toLocaleString("ru-RU")} ₸
                </div>

            </div>

            <div class="qty">

                <button onclick="changeQty(${product.id}, -1)">
                    −
                </button>

                <b>${item.qty}</b>

                <button onclick="changeQty(${product.id}, 1)">
                    +
                </button>

            </div>
        `;

        container.appendChild(row);

    });

}


function changeQty(id, change) {

    const item =
        cart.find(item => item.id === id);

    if (!item) return;

    item.qty += change;

    if (item.qty <= 0) {

        cart =
            cart.filter(item => item.id !== id);

    }

    updateCart();
}


/* =========================
   МОДАЛЬНЫЕ ОКНА
========================= */

function openCart() {

    document
        .getElementById("cartModal")
        .classList.add("active");

    updateCart();
}

function closeCart() {

    document
        .getElementById("cartModal")
        .classList.remove("active");
}


function openOrder() {

    if (cart.length === 0) {

        alert("Сначала добавь что-нибудь в корзину 🍗");

        return;
    }

    closeCart();

    document
        .getElementById("orderModal")
        .classList.add("active");
}

function closeOrder() {

    document
        .getElementById("orderModal")
        .classList.remove("active");
}


/* =========================
   ОФОРМЛЕНИЕ
========================= */

function sendOrder() {

    const name =
        document.getElementById("customerName").value;

    const phone =
        document.getElementById("customerPhone").value;

    const address =
        document.getElementById("customerAddress").value;


    if (!name || !phone) {

        alert("Укажи имя и телефон.");

        return;
    }


    const order = {

        city: currentCity,

        name: name,

        phone: phone,

        address: address,

        items: cart.map(item => {

            const product =
                products.find(p => p.id === item.id);

            return {

                name: product.name,

                quantity: item.qty,

                price: product.price

            };

        })

    };


    console.log("ORDER:", order);


    if (tg) {

        tg.sendData(
            JSON.stringify(order)
        );

    }


    alert(
        "Заказ принят! 🍗\n\n" +
        "Готовим твоё преступление."
    );

}


/* =========================
   НАВИГАЦИЯ
========================= */

function goHome() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

function showInfo() {

    alert(
        "КУРИЦА НЕ ВИНОВАТА\n\n" +
        "Виноват её вкус.\n\n" +
        "Хрустящие крылья, соусы и комбо.\n" +
        "Павлодар • Костанай • другие города скоро."
    );

}


/* =========================
   START
========================= */

renderProducts();

updateCart();

</script>

</body>
</html>
